ServerName localhost
ServerTokens Prod
ServerSignature Off
# La charge cible est un atelier. Borner le nombre de processus PHP.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    MaxRequestWorkers 12
    MaxConnectionsPerChild 500
</IfModule>

<VirtualHost *:8080>
    DocumentRoot /var/www/atelier/public
    DirectoryIndex index.html
    <Directory /var/www/atelier/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        LimitRequestBody 16384
    </Directory>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
