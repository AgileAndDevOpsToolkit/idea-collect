apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atelier-idees-data
spec:
  # Utilise la StorageClass par défaut. Au besoin, préciser storageClassName ici.
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atelier-idees
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: atelier-idees
  template:
    metadata:
      labels:
        app: atelier-idees
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # GitHub Actions remplace cette référence par le digest publié dans son artefact RKE2.
          image: ghcr.io/votre-compte/atelier-idees:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health.php
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 384Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: atelier-idees-data
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: atelier-idees
spec:
  type: ClusterIP
  selector:
    app: atelier-idees
  ports:
    - {name: http, port: 80, targetPort: http}
